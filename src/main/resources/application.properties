# URL de conexão com o banco de dados
flyway.url=jdbc:mysql://localhost:3306/moradores

# Usuário do banco de dados
flyway.user=root

# Senha do banco de dados
flyway.password=0000

# Localização dos scripts de migração (opcional, padrão: resources/db/migration)
flyway.locations=filesystem:src/main/resources/db/migration

# Ativar validação de migrações antes de rodar (recomendado)
flyway.validateOnMigrate=true